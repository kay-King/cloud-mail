<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="Cloud Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Cloud Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>Cloud Mail</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
      // 界面主题（品牌风）：启动时先应用，防闪烁；非法值回落默认
      // 品牌名单唯一来源：存在 window.__BRANDS 供下方加载屏换图脚本共用，新增品牌只改这里
      window.__BRANDS = ['default', 'gmail', 'outlook', 'qq', 'apple', '163', 'yahoo']
      const brand = window.__BRANDS.includes(uiStore.brand) ? uiStore.brand : 'default'
      root.setAttribute('data-brand', brand);
    }
    const metaTag = document.getElementById('theme-color-meta');
    const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
    metaTag.setAttribute('content', isDark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#FFFFFF' : '#F1F1F1'));
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .loading-image {
    width: 112px;
    height: 112px;
    object-fit: contain;
  }

  .loading-name {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
    /* 图标图本身带透明边（默认 PNG 上下各 32px/192px，112px 显示时约 19px），
       加上 flex 的 16px 间距，视觉间隙约 35px 太大；往上收 18px，视觉间隙约 17px */
    margin-top: -18px;
    color: #1f1f1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .dark .loading-name {
    color: #e5e5e5;
  }

  .loading-progress {
    position: relative;
    width: 160px;
    height: 4px;
    margin-top: 12px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(64, 158, 255, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #409EFF;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(64, 158, 255, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(156px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(156px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/mail-pwa.png" alt="Cloud Mail">
    <div class="loading-name">Cloud Mail</div>
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script>
  // 加载屏 Logo 跟随品牌主题（启动脚本在 head 里已读过 localStorage，这里只换图）
  (function () {
    try {
      var ui = JSON.parse(localStorage.getItem('ui') || '{}');
      var brand = ui.brand;
      // 品牌名单与 head 启动脚本共用 window.__BRANDS；default 用默认图，不换
      var brands = window.__BRANDS || [];
      if (brand !== 'default' && brands.indexOf(brand) !== -1) {
        var img = document.querySelector('#loading-first .loading-image');
        if (img) img.src = '/mail-' + brand + '.svg';
      }
    } catch (e) {}
  })();
  // 启动自救：注销离线缓存、清空全部缓存再刷新，拿新版。5 分钟内最多自救两次，防循环刷新。
  // 两层检查，共用一次计数：
  // ① 25 秒查 __APP_BOOTED__：主文件没开始执行（通常是离线缓存给了旧页面、旧文件已不存在，
  //    服务器对不存在的文件返回首页 HTML，浏览器因类型不对拒绝执行，卡在信封启动屏）；
  // ② 150 秒查 __APP_MOUNTED__：主文件已执行但 init 挂起、一直没挂载（init 最长约 2 分钟，
  //    150 秒还没挂载说明真卡住了；不等 25 秒那层，避免慢网下打断一次可能成功的 init）。
  (function () {
    var KEY = 'cloudmail-boot-reload';
    function rescue() {
      var record = {count: 0, first: 0};
      try { record = JSON.parse(sessionStorage.getItem(KEY) || '{"count":0,"first":0}'); } catch (e) {}
      if (Date.now() - record.first > 300000) record = {count: 0, first: Date.now()};
      if (record.count >= 2) return;
      record.count++;
      try { sessionStorage.setItem(KEY, JSON.stringify(record)); } catch (e) {}
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {}));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {}));
      }
      Promise.all(jobs).then(function () { location.reload(); });
    }
    setTimeout(function () {
      if (window.__APP_BOOTED__) return;
      rescue();
    }, 25000);
    setTimeout(function () {
      if (window.__APP_MOUNTED__) return;
      rescue();
    }, 150000);
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
