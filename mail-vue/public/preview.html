<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附件预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; color: #222; }
  .topbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #eee; background: #fff; }
  .topbar .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .topbar button { border: 1px solid #dcdfe6; background: #fff; border-radius: 4px; padding: 6px 14px; font-size: 14px; cursor: pointer; color: #606266; }
  .topbar button:hover { color: #409eff; border-color: #c6e2ff; background: #ecf5ff; }
  .topbar button.primary { background: #409eff; border-color: #409eff; color: #fff; }
  .topbar button.primary:hover { background: #66b1ff; }
  #view { flex: 1; min-height: 0; background: #f7f8fa; overflow: auto; display: flex; }
  #view img.doc-img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; }
  #view iframe { width: 100%; height: 100%; border: 0; display: block; }
  #view pre { margin: 0; padding: 20px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.6; }
  #view .media-wrap { margin: auto; width: 100%; max-width: 900px; padding: 20px; }
  #view .media-wrap audio { width: 100%; }
  #view .media-wrap video { width: 100%; max-height: 80vh; display: block; }
  #office-root { flex: 1; min-width: 0; min-height: 0; overflow-x: hidden; }
  /* pptx 组件根节点须有高度，否则内部 height:100% 的容器量不到高度、预览器回落到 540px */
  #office-root .vue-office-pptx { height: 100%; }
  #office-root .pptx-preview-wrapper { overflow-x: hidden; background: #f5f7fa !important; }
  .state { margin: auto; text-align: center; color: #909399; font-size: 14px; line-height: 1.8; padding: 20px; }
  .state .big { font-size: 40px; margin-bottom: 8px; }
  .state .fname { color: #222; font-size: 15px; word-break: break-all; }
  .state .detail { color: #c0c4cc; font-size: 12px; word-break: break-all; max-width: 560px; margin: 6px auto 0; }
  .state button { margin-top: 14px; border: 1px solid #dcdfe6; background: #fff; border-radius: 4px; padding: 8px 18px; font-size: 14px; cursor: pointer; color: #409eff; border-color: #c6e2ff; }
  .spinner { width: 32px; height: 32px; margin: 0 auto 12px; border: 3px solid #e5e5e5; border-top-color: #409eff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media print {
    .topbar { display: none; }
    #view { overflow: visible; background: #fff; }
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="name" id="fname"></span>
  <span class="spacer"></span>
  <button id="btn-print">打印</button>
  <button id="btn-download" class="primary">下载</button>
</div>
<div id="view"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = params.get('src') || '';
  var name = params.get('name') || '';
  var view = document.getElementById('view');
  var TEXT_MAX = 512 * 1024;
  var IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico', 'avif'];
  var TEXT_EXTS = ['txt', 'md', 'log', 'ini', 'conf', 'json', 'xml', 'csv', 'yaml', 'yml'];
  var AUDIO_EXTS = ['mp3', 'wav', 'flac', 'aac', 'ogg', 'oga', 'm4a', 'opus'];
  var VIDEO_EXTS = ['mp4', 'webm', 'm4v', 'ogv'];

  document.title = name || '附件预览';
  document.getElementById('fname').textContent = name || '附件预览';
  document.getElementById('btn-download').onclick = function () {
    var a = document.createElement('a');
    a.href = src;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  document.getElementById('btn-print').onclick = function () { window.print(); };

  function extOf(n) {
    var i = n.lastIndexOf('.');
    return i >= 0 ? n.slice(i + 1).toLowerCase() : '';
  }
  function showState(html) { view.innerHTML = html; }
  function showLoading(text) {
    showState('<div class="state"><div class="spinner"></div><div>' + text + '</div></div>');
  }
  function showUnsupported(msg, detail, showDownload) {
    var el = document.createElement('div');
    el.className = 'state';
    var big = document.createElement('div'); big.className = 'big'; big.textContent = '\uD83D\uDCC4';
    var fn = document.createElement('div'); fn.className = 'fname'; fn.textContent = name;
    var m = document.createElement('div'); m.textContent = msg;
    el.appendChild(big); el.appendChild(fn); el.appendChild(m);
    if (detail) {
      var d = document.createElement('div'); d.className = 'detail';
      d.textContent = detail;
      el.appendChild(d);
    }
    // showDownload=false 时不给下载按钮：src 本身不可信时连下载入口也不留
    if (showDownload === false) {
      view.innerHTML = '';
      view.appendChild(el);
      return;
    }
    var btn = document.createElement('button'); btn.textContent = '下载查看';
    btn.onclick = function () { document.getElementById('btn-download').click(); };
    el.appendChild(btn);
    view.innerHTML = '';
    view.appendChild(el);
  }
  // 失败时附带原始错误信息（截断），方便定位是文件问题还是解析库问题
  function errDetail(e) {
    var msg = e && e.message ? String(e.message) : '';
    return msg ? msg.slice(0, 200) : '';
  }
  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('load failed: ' + url)); };
      document.head.appendChild(s);
    });
  }
  function loadCss(url) {
    return new Promise(function (resolve, reject) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = url;
      l.onload = resolve;
      l.onerror = function () { reject(new Error('load failed: ' + url)); };
      document.head.appendChild(l);
    });
  }

  if (!src) { showUnsupported('缺少文件地址，无法预览'); return; }
  // 同源校验：站内调用传的永远是本站附件地址（相对路径 /attachments/…，或本站同源绝对地址；
  // 后端 refresh() 把 r2Domain 强制置空，附件 URL 没有跨域分支）。非同源 src 一律拒绝，
  // 否则任意人可构造本站链接、借「附件预览」的标题与顶栏展示第三方页面（钓鱼伪装）。
  // new URL 带 base 解析：相对地址解析为本站同源；javascript:/data: 等解析后 origin 为 null，直接拒绝。
  var srcOk = false;
  try {
    srcOk = new URL(src, location.href).origin === location.origin;
  } catch (e) {
    srcOk = false;
  }
  if (!srcOk) {
    document.getElementById('btn-download').style.display = 'none';
    document.getElementById('btn-print').style.display = 'none';
    showUnsupported('该文件地址不受支持，无法预览', null, false);
    return;
  }
  var ext = extOf(name);

  if (IMAGE_EXTS.indexOf(ext) >= 0) {
    var img = document.createElement('img');
    img.className = 'doc-img'; img.src = src; img.alt = name;
    img.onerror = function () { showUnsupported('图片加载失败，请下载后查看'); };
    view.appendChild(img);
  } else if (ext === 'pdf') {
    var fr = document.createElement('iframe');
    // 纵深防御：iframe 完全沙箱化（不放行脚本与同源），即使 src 校验被绕过，
    // 框内页面也跑不了脚本、碰不到父页面；浏览器内置 PDF 查看器不受影响
    fr.setAttribute('sandbox', '');
    fr.src = src;
    view.appendChild(fr);
  } else if (TEXT_EXTS.indexOf(ext) >= 0) {
    showLoading('正在加载…');
    fetch(src).then(function (r) { if (!r.ok) throw new Error('fetch failed'); return r.blob(); })
      .then(function (b) {
        if (b.size > TEXT_MAX) { showUnsupported('文本过大，请下载后查看'); return null; }
        return b.text();
      })
      .then(function (t) {
        if (t === null) return;
        var pre = document.createElement('pre');
        pre.textContent = t;
        view.innerHTML = '';
        view.appendChild(pre);
      })
      .catch(function () { showUnsupported('文本加载失败，请下载后查看'); });
  } else if (AUDIO_EXTS.indexOf(ext) >= 0 || VIDEO_EXTS.indexOf(ext) >= 0) {
    var wrap = document.createElement('div');
    wrap.className = 'media-wrap';
    var media = document.createElement(AUDIO_EXTS.indexOf(ext) >= 0 ? 'audio' : 'video');
    media.src = src; media.controls = true; media.autoplay = true;
    wrap.appendChild(media);
    view.appendChild(wrap);
  } else if (ext === 'docx' || ext === 'xls' || ext === 'xlsx') {
    var isDocx = ext === 'docx';
    showLoading('正在加载预览…');
    var js = isDocx ? 'preview-libs/js-preview-docx-1.6.4.umd.js' : 'preview-libs/js-preview-excel-1.7.14.umd.js';
    var css = isDocx ? 'preview-libs/js-preview-docx-1.6.4.css' : 'preview-libs/js-preview-excel-1.7.14.css';
    Promise.all([loadScript(js), loadCss(css)]).then(function () {
      var lib = isDocx ? window.jsPreviewDocx : window.jsPreviewExcel;
      if (!lib) throw new Error('lib missing');
      view.innerHTML = '';
      var root = document.createElement('div');
      root.id = 'office-root';
      view.appendChild(root);
      return lib.init(root).preview(src);
    }).catch(function (e) { showUnsupported('预览失败，请下载后查看', errDetail(e)); });
  } else if (ext === 'pptx') {
    showLoading('正在加载预览…');
    // pptx UMD 内嵌的 ECharts 在求值时读 process.env.NODE_ENV；浏览器里没有
    // process，不垫一个会抛错、全局对象挂不上
    if (typeof window.process === 'undefined') window.process = { env: { NODE_ENV: 'production' } };
    else if (!window.process.env) window.process.env = { NODE_ENV: 'production' };
    // 独立页面没有 Vue 运行时，从 CDN 取 Vue 3.5.13 全局构建（与应用版本一致）
    loadScript('https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js').then(function () {
      window.VueDemi = Object.assign({}, window.Vue, { isVue2: false, isVue3: true });
      return loadScript('preview-libs/vue-office-pptx-1.0.1.umd.js');
    }).then(function () {
      var comp = window['vue-office-pptx'];
      if (!comp) throw new Error('pptx lib missing');
      view.innerHTML = '';
      var root = document.createElement('div');
      root.id = 'office-root';
      view.appendChild(root);
      var app = window.Vue.createApp({
        data: function () { return { src: src }; },
        methods: { onErr: function (e) { showUnsupported('预览失败，请下载后查看', errDetail(e)); } },
        template: '<vue-office-pptx :src="src" @error="onErr" style="height:100%" />'
      });
      app.component('vue-office-pptx', comp);
      app.mount(root);
    }).catch(function (e) { showUnsupported('预览失败，请下载后查看', errDetail(e)); });
  } else {
    showUnsupported('该格式不支持在线预览');
  }
})();
</script>
</body>
</html>
